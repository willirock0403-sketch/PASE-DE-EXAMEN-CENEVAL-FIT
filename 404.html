<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Registro en línea al EXANI-II — esta guía cambió de dirección</title>
<script>
// Lleva cualquier enlace viejo (video, PDF, imagen) a la misma ruta dentro de la guía nueva.
(function(){
  var base = "/pase-de-examen-ceneval-fit/".toLowerCase(), p = location.pathname, i = p.toLowerCase().indexOf(base);
  var resto = i >= 0 ? p.slice(i + base.length) : "";
  resto = resto.replace(/^video\//, "");
  location.replace("https://examenes-estandarizados.github.io/exani/" + resto + location.search + location.hash);
})();
</script>
</head>
<body><p><a href="https://examenes-estandarizados.github.io/exani/">https://examenes-estandarizados.github.io/exani/</a></p></body>
